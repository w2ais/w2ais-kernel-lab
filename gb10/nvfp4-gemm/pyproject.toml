[project]
name = "gb10-nvfp4-gemm-worklog"
version = "0.1.0"
description = "Numbered CuTe DSL NVFP4 GEMM experiments for NVIDIA GB10"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.9.0+cu130", "nvidia-cutlass-dsl[cu13]==4.5.2", "cuda-python==13.3.1", "cuda-core==1.0.1", "numpy==2.4.6"]

[dependency-groups]
format = ["ruff==0.17.3"]
figures = ["cairosvg>=2.8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"
