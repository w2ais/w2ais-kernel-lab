[project]
name = "gb10-mma-microbench"
version = "0.2.0"
description = "GB10 instruction and memory microbenchmarks in CuTe DSL"
requires-python = ">=3.12"
dependencies = [
    "cuda-python==13.5.0",
    "numpy==2.5.4",
    "nvidia-cutlass-dsl[cu13]==4.8.1",
]

[project.optional-dependencies]
profile = [
    "nsight-python==1.1.1",
]

[tool.uv]
package = false
